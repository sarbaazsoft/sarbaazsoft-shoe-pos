    <!-- PWA & Mobile Meta Tags (App Primary Purple Theme) -->
    <meta name="theme-color" content="#9333EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" type="image/png" sizes="48x48" href="/admin/favicon.png" />

    <!-- Prevent flash during bootstrap with solid white background -->
    <style>
      html, body {
        background-color: #FFFFFF;
      }
    </style>

    <!-- Initialize Theme before React renders to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('pos_theme');
          let isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            // default to light
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
          const accentMetaColors = {
            purple: '#9333EA',
            red: '#F44336',
            orange: '#F97316',
            emerald: '#10B981',
            cyan: '#06B6D4',
            teal: '#14B8A6',
            indigo: '#6366F1',
            violet: '#8B5CF6',
            pink: '#EC4899',
            fuchsia: '#D946EF',
            stone: '#78716C'
          };
          const storedAccent = localStorage.getItem('pos_accent_theme');
          const activeAccent = storedAccent && accentMetaColors[storedAccent] ? storedAccent : 'purple';
          document.documentElement.setAttribute('data-accent-theme', activeAccent);
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', accentMetaColors[activeAccent]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- PWA Install Prompt Capture & Root Service Worker Registration (PWABuilder & Chromium WebAPK compliant) -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        var alreadyInstalled = false;
        try {
          var inStandaloneMode =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: window-controls-overlay)').matches) ||
            window.navigator.standalone === true ||
            (document.referrer && document.referrer.indexOf('android-app://') === 0);
          if (!inStandaloneMode && localStorage.getItem('pos_pwa_installed') === '1') {
            localStorage.removeItem('pos_pwa_installed');
          }
          alreadyInstalled = Boolean(window.__pwaInstalled) || inStandaloneMode;
        } catch (err) {}
        if (alreadyInstalled) {
          window.__deferredPwaPrompt = null;
          return;
        }
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-captured'));
      });

      window.addEventListener('appinstalled', function () {
        window.__pwaInstalled = true;
        window.__deferredPwaPrompt = null;
        try {
          localStorage.setItem('pos_pwa_installed', '1');
        } catch (err) {}
      });

      if ('serviceWorker' in navigator) {
        var registerRootServiceWorker = function () {
          var hadController = Boolean(navigator.serviceWorker.controller);
          var refreshing = false;

          var activateWaitingWorker = function (worker) {
            if (!worker) return;
            if (window.__POS_HOLD_SW_UPDATE__) {
              window.__POS_WAITING_SW__ = worker;
              return;
            }
            window.__POS_WAITING_SW__ = null;
            worker.postMessage({ type: 'SKIP_WAITING' });
          };

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController || refreshing) return;
            try {
              var lastReload = Number(sessionStorage.getItem('__pos_sw_reload_at') || '0');
              if (lastReload && Date.now() - lastReload < 15000) {
                return;
              }
              sessionStorage.setItem('__pos_sw_reload_at', String(Date.now()));
            } catch (e) {}
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (registration) {
              if (registration.waiting && navigator.serviceWorker.controller) {
                activateWaitingWorker(registration.waiting);
              }
              registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      activateWaitingWorker(newWorker);
                    }
                  });
                }
              });
              registration.update().catch(function () {});
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function () {});
                }
              });
            })
            .catch(function (error) {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        };

        if (document.readyState === 'complete') {
          registerRootServiceWorker();
        } else {
          window.addEventListener('load', registerRootServiceWorker);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
