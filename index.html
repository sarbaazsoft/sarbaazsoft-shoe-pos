<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="SarbaazSoft Shoe POS" />
    <meta property="og:description" content="Dual-engine retail and wholesale footwear POS with offline-first billing, carton and pair inventory, customer and supplier khata, direct WebUSB printing, push and email alerts, Sammi AI Assistant, and installable PWA apps for Android, iOS, and Windows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Courgette, Inter & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courgette&family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" />

    <!-- PWA & Mobile Meta Tags (Dynamically synchronized to Primary Theme Color before hydration) -->
    <meta name="theme-color" content="#9333EA" />
    <meta name="msapplication-navbutton-color" content="#9333EA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SarbaazSoft ShoePOS" />
    <meta name="application-name" content="SarbaazSoft ShoePOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/admin/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/admin/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/admin/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/admin/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Prevent flash during bootstrap with solid white/dark background & edge-to-edge system bar inset -->
    <style>
      :root {
        --pwa-theme-color: #9333EA;
        --android-status-bar-color: #9333EA;
        --android-nav-bar-color: #9333EA;
        --android-nav-bar-icon-color: #FFFFFF;
        --android-nav-bar-divider-color: rgba(255, 255, 255, 0.2);
      }
      html, body {
        background-color: #FFFFFF;
      }
      html.dark, html.dark body {
        background-color: #0A0E1A;
      }
      @media screen {
        body {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        body::after {
          content: '';
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: env(safe-area-inset-bottom, 0px);
          overflow: hidden;
          background-color: var(--android-nav-bar-color, var(--pwa-theme-color, var(--primary, #9333EA)));
          box-shadow: inset 0 1px 0 var(--android-nav-bar-divider-color, transparent);
          pointer-events: none;
          z-index: 2147483647;
        }
      }
      @media print {
        body {
          padding-bottom: 0 !important;
        }
        body::after {
          display: none !important;
        }
      }
    </style>

    <!-- Initialize Theme before React renders to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('pos_theme') || localStorage.getItem('pos_guest_theme');
          let isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            // default to light
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.setAttribute('data-theme', 'light');
          }
          const accentMetaColors = {
            purple: '#9333EA',
            indigo: '#4F46E5',
            cyan: '#06B6D4',
            teal: '#0D9488',
            orange: '#F97316',
            red: '#EF4444',
            burgundy: '#9F1239',
            pink: '#EC4899'
          };
          const accentAliases = {
            violet: 'purple',
            fuchsia: 'pink',
            rose: 'pink',
            amber: 'orange',
            gold: 'orange',
            bronze: 'orange',
            sky: 'cyan',
            blue: 'indigo',
            emerald: 'teal',
            green: 'teal',
            lime: 'teal',
            slate: 'indigo',
            stone: 'indigo'
          };
          const rawStoredAccent = localStorage.getItem('pos_accent_theme') || localStorage.getItem('pos_guest_accent_theme');
          const mappedAccent = rawStoredAccent && accentAliases[rawStoredAccent] ? accentAliases[rawStoredAccent] : rawStoredAccent;
          let activeAccent = 'purple';
          let activeHex = accentMetaColors.purple;
          if (mappedAccent === 'custom') {
            const storedCustomHex = localStorage.getItem('pos_custom_accent_hex') || localStorage.getItem('pos_guest_custom_accent_hex');
            if (storedCustomHex && /^#[0-9A-F]{6}$/i.test(storedCustomHex)) {
              activeAccent = 'custom';
              activeHex = storedCustomHex.toUpperCase();
            }
          } else if (mappedAccent && accentMetaColors[mappedAccent]) {
            activeAccent = mappedAccent;
            activeHex = accentMetaColors[mappedAccent];
          }
          const root = document.documentElement;
          root.setAttribute('data-accent-theme', activeAccent);

          // Compute WCAG contrast for Android system bar icons (light vs dark icons)
          const clean = activeHex.slice(1);
          const toLin = function (v) {
            const n = v / 255;
            return n <= 0.03928 ? n / 12.92 : Math.pow((n + 0.055) / 1.055, 2.4);
          };
          const lum = 0.2126 * toLin(parseInt(clean.slice(0, 2), 16))
            + 0.7152 * toLin(parseInt(clean.slice(2, 4), 16))
            + 0.0722 * toLin(parseInt(clean.slice(4, 6), 16));
          const whiteContrast = 1.05 / (lum + 0.05);
          const darkContrast = (lum + 0.05) / (0.0152 + 0.05);
          const useLightIcons = whiteContrast >= 3.0 || whiteContrast >= darkContrast;
          const isLightNavBg = !useLightIcons;
          const iconColor = useLightIcons ? '#FFFFFF' : '#0F172A';
          const dividerColor = isDark
            ? 'rgba(255, 255, 255, 0.16)'
            : (isLightNavBg ? 'rgba(15, 23, 42, 0.14)' : 'rgba(255, 255, 255, 0.20)');

          root.style.setProperty('--pwa-theme-color', activeHex);
          root.style.setProperty('--android-status-bar-color', activeHex);
          root.style.setProperty('--android-nav-bar-color', activeHex);
          root.style.setProperty('--android-nav-bar-icon-color', iconColor);
          root.style.setProperty('--android-nav-bar-divider-color', dividerColor);
          root.setAttribute('data-nav-bar-contrast', isLightNavBg ? 'dark' : 'light');
          root.setAttribute('data-android-nav-bar-color', activeHex);

          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', activeHex);
          }
          const metaNavButton = document.querySelector('meta[name="msapplication-navbutton-color"]');
          if (metaNavButton) {
            metaNavButton.setAttribute('content', activeHex);
          }
          const metaAppleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (metaAppleStatus) {
            metaAppleStatus.setAttribute('content', isLightNavBg ? 'default' : 'black-translucent');
          }
          try {
            if (window.AndroidNavigationBar && typeof window.AndroidNavigationBar.setSystemBarsColor === 'function') {
              window.AndroidNavigationBar.setSystemBarsColor(activeHex, activeHex, isLightNavBg);
            } else if (window.AndroidNavigationBar && typeof window.AndroidNavigationBar.setNavigationBarColor === 'function') {
              window.AndroidNavigationBar.setNavigationBarColor(activeHex, isLightNavBg);
            }
            if (window.Android && typeof window.Android.setSystemBarsColor === 'function') {
              window.Android.setSystemBarsColor(activeHex, activeHex, isLightNavBg);
            } else if (window.Android && typeof window.Android.setNavigationBarColor === 'function') {
              window.Android.setNavigationBarColor(activeHex, isLightNavBg);
            }
          } catch (bridgeErr) {}

          const rawBackdropStyle = localStorage.getItem('pos_backdrop_style') || localStorage.getItem('pos_guest_backdrop_style');
          const backdropStyle = rawBackdropStyle === 'showroom' ? 'showroom' : 'solid';
          const rawDarknessPrimary = localStorage.getItem('pos_backdrop_darkness');
          const rawDarknessFallback = localStorage.getItem('pos_guest_backdrop_darkness');
          const rawDarknessStr = rawDarknessPrimary !== null && rawDarknessPrimary.trim() !== ''
            ? rawDarknessPrimary
            : rawDarknessFallback;
          const rawDarkness = rawDarknessStr !== null && rawDarknessStr.trim() !== ''
            ? Number(rawDarknessStr)
            : NaN;
          const backdropDarkness = Number.isFinite(rawDarkness)
            ? Math.max(0, Math.min(100, Math.round(rawDarkness)))
            : 55;
          document.documentElement.setAttribute('data-backdrop-style', backdropStyle);
          document.documentElement.style.setProperty('--backdrop-darkness', String(backdropDarkness));
          document.documentElement.style.setProperty('--backdrop-darkness-alpha', (backdropDarkness / 100).toFixed(2));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- PWA Install Prompt Capture & Root Service Worker Registration (PWABuilder & Chromium WebAPK compliant) -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        var alreadyInstalled = false;
        try {
          var inStandaloneMode =
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
            (window.matchMedia && window.matchMedia('(display-mode: window-controls-overlay)').matches) ||
            window.navigator.standalone === true ||
            (document.referrer && document.referrer.indexOf('android-app://') === 0);
          if (!inStandaloneMode && localStorage.getItem('pos_pwa_installed') === '1') {
            localStorage.removeItem('pos_pwa_installed');
          }
          alreadyInstalled = Boolean(window.__pwaInstalled) || inStandaloneMode;
        } catch (err) {}
        if (alreadyInstalled) {
          window.__deferredPwaPrompt = null;
          return;
        }
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-captured'));
      });

      window.addEventListener('appinstalled', function () {
        window.__pwaInstalled = true;
        window.__deferredPwaPrompt = null;
        try {
          localStorage.setItem('pos_pwa_installed', '1');
        } catch (err) {}
      });

      if ('serviceWorker' in navigator) {
        var registerRootServiceWorker = function () {
          var hadController = Boolean(navigator.serviceWorker.controller);
          var refreshing = false;

          var activateWaitingWorker = function (worker) {
            if (!worker) return;
            if (window.__POS_HOLD_SW_UPDATE__) {
              window.__POS_WAITING_SW__ = worker;
              return;
            }
            window.__POS_WAITING_SW__ = null;
            worker.postMessage({ type: 'SKIP_WAITING' });
          };

          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController || refreshing) return;
            try {
              var lastReload = Number(sessionStorage.getItem('__pos_sw_reload_at') || '0');
              if (lastReload && Date.now() - lastReload < 15000) {
                return;
              }
              sessionStorage.setItem('__pos_sw_reload_at', String(Date.now()));
            } catch (e) {}
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js', { scope: '/', updateViaCache: 'none' })
            .then(function (registration) {
              if (registration.waiting && navigator.serviceWorker.controller) {
                activateWaitingWorker(registration.waiting);
              }
              registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function () {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      activateWaitingWorker(newWorker);
                    }
                  });
                }
              });
              registration.update().catch(function () {});
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') {
                  registration.update().catch(function () {});
                }
              });
            })
            .catch(function (error) {
              console.warn('[PWA] Service Worker registration failed:', error);
            });
        };

        if (document.readyState === 'complete') {
          registerRootServiceWorker();
        } else {
          window.addEventListener('load', registerRootServiceWorker);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
